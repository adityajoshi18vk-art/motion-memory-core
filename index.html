<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Memory Core</title>
  <meta name="description" content="Upload human motion video for Gemini neural compilation">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Decorative glowing background elements */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.4;
    }

    .blob-1 {
      width: 350px;
      height: 350px;
      background: #3b82f6;
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 400px;
      height: 400px;
      background: #8b5cf6;
      bottom: -150px;
      right: -100px;
    }

    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 30px 40px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 95%;
      position: relative;
      z-index: 10;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(to right, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Tabs/Toggle */
    .view-selector {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .view-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    /* Drag and Drop Zone */
    .drop-zone {
      border: 2px dashed rgba(96, 165, 250, 0.3);
      border-radius: 16px;
      padding: 60px 20px;
      background: rgba(59, 130, 246, 0.03);
      transition: all 0.3s ease;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .drop-zone.dragover {
      background: rgba(59, 130, 246, 0.1);
      border-color: #60a5fa;
      transform: scale(1.01);
    }

    /* Camera Section */
    #camera-section {
      display: none;
      margin-bottom: 20px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 15px;
    }

    #camera-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rec-indicator {
      position: absolute;
      top: 15px;
      left: 15px;
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 10px;
      border-radius: 20px;
      color: #ef4444;
      font-size: 12px;
      font-weight: 800;
    }

    .rec-indicator.active {
      display: flex;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .camera-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      display: none;
    }

    .upload-icon {
      margin-bottom: 15px;
      color: #8b5cf6;
    }

    .upload-text {
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
      margin: 0;
    }

    .upload-subtext {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }

    input[type="file"] {
      display: none;
    }

    #status {
      font-size: 14px;
      font-weight: 600;
      min-height: 24px;
      transition: color 0.3s ease;
    }

    .loading {
      color: #60a5fa;
      animation: pulse 1.5s infinite;
    }

    .success {
      color: #34d399;
    }

    .error {
      color: #f87171;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <h1>Motion Memory Core</h1>
    <p class="subtitle">Neural Kinematic Compiler v1.2</p>

    <div class="view-selector">
      <button class="view-btn active" id="tab-upload">📁 Upload Video</button>
      <button class="view-btn" id="tab-camera">🎥 Live Capture</button>
    </div>

    <!-- Upload Section -->
    <div id="upload-section">
      <div class="drop-zone" id="drop-zone">
        <svg class="upload-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p class="upload-text">Click to browse or drag video here</p>
        <p class="upload-subtext">Supports MP4, MOV, AVI</p>
      </div>
      <input type="file" id="video-upload" accept="video/*">
    </div>

    <!-- Camera Section -->
    <div id="camera-section">
      <div class="video-wrap">
        <video id="camera-preview" autoplay muted playsinline></video>
        <div class="rec-indicator" id="rec-indicator">
          <div class="rec-dot"></div> REC
        </div>
      </div>
      <div class="camera-controls">
        <button class="btn btn-primary" id="start-rec">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
          Start Recording
        </button>
        <button class="btn btn-danger" id="stop-rec">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
          Stop & Compile
        </button>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const fileInput = document.getElementById('video-upload');
    const statusDiv = document.getElementById('status');
    const dropZone = document.getElementById('drop-zone');
    const tabUpload = document.getElementById('tab-upload');
    const tabCamera = document.getElementById('tab-camera');
    const uploadSection = document.getElementById('upload-section');
    const cameraSection = document.getElementById('camera-section');
    const cameraPreview = document.getElementById('camera-preview');
    const btnStartRec = document.getElementById('start-rec');
    const btnStopRec = document.getElementById('stop-rec');
    const recIndicator = document.getElementById('rec-indicator');

    let mediaRecorder;
    let recordedChunks = [];
    let stream;
    let recordingTimeout;
    let countdownInterval;

    // --- 1. View Toggling ---
    tabUpload.addEventListener('click', () => {
      tabUpload.classList.add('active');
      tabCamera.classList.remove('active');
      uploadSection.style.display = 'block';
      cameraSection.style.display = 'none';
      stopCamera();
    });

    tabCamera.addEventListener('click', async () => {
      tabCamera.classList.add('active');
      tabUpload.classList.remove('active');
      uploadSection.style.display = 'none';
      cameraSection.style.display = 'block';
      await startCamera();
    });

    // --- 2. Camera Logic ---
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        cameraPreview.srcObject = stream;
        statusDiv.textContent = "";
      } catch (err) {
        statusDiv.className = 'error';
        statusDiv.textContent = "❌ Error: Could not access camera.";
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    }

    btnStartRec.addEventListener('click', () => {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        processVideo(blob);
      };

      // UI States
      mediaRecorder.start();
      btnStartRec.style.display = 'none';
      btnStopRec.style.display = 'flex';
      recIndicator.classList.add('active');
      
      // Enforce 5 Second Limit
      let secondsLeft = 5;
      statusDiv.className = 'loading';
      statusDiv.textContent = `🔴 Recording... (${secondsLeft}s)`;

      countdownInterval = setInterval(() => {
        secondsLeft--;
        statusDiv.textContent = `🔴 Recording... (${secondsLeft}s)`;
        if (secondsLeft <= 0) clearInterval(countdownInterval);
      }, 1000);

      recordingTimeout = setTimeout(() => {
        if (mediaRecorder.state === 'recording') {
          stopRecordingActions();
        }
      }, 5000);
    });

    btnStopRec.addEventListener('click', () => {
      stopRecordingActions();
    });

    function stopRecordingActions() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      
      // Cleanup timers
      clearTimeout(recordingTimeout);
      clearInterval(countdownInterval);
      
      // UI Reset
      btnStartRec.style.display = 'flex';
      btnStopRec.style.display = 'none';
      recIndicator.classList.remove('active');
    }

    // --- 3. Upload & Drag Logic ---
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) processVideo(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) processVideo(e.dataTransfer.files[0]);
    });

    // --- 4. Main Processing Function ---
    async function processVideo(blobOrFile) {
      statusDiv.className = 'loading';
      statusDiv.textContent = '🚀 Compiling via Gemini...';
      
      // Disable interaction
      dropZone.style.opacity = '0.5';
      dropZone.style.pointerEvents = 'none';
      btnStartRec.disabled = true;

      const formData = new FormData();
      // Ensure we pass a filename so Flask handles it as a file
      formData.append('video', blobOrFile, 'capture.webm');

      try {
        const response = await fetch('http://127.0.0.1:5000/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (response.ok) {
          statusDiv.className = 'success';
          statusDiv.textContent = `✅ ${data.message} (${data.commands_generated} frames)`;
        } else {
          statusDiv.className = 'error';
          statusDiv.textContent = `❌ Error: ${data.error || 'Server processing failed'}`;
        }
      } catch (err) {
        statusDiv.className = 'error';
        statusDiv.textContent = `❌ Network Error: Could not reach the Flask server.`;
      } finally {
        fileInput.value = '';
        dropZone.style.opacity = '1';
        dropZone.style.pointerEvents = 'auto';
        btnStartRec.disabled = false;
      }
    }
  </script>
</body>

</html>
